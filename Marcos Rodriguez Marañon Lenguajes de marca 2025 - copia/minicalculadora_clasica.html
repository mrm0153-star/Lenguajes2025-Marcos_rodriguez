<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Codificación de caracteres -->
    <meta charset="UTF-8">

    <!-- Adaptación a dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título de la página -->
    <title>Calculadora Funcional</title>
</head>
<body>

    <!-- Entrada del primer número -->
    <label>Primer número: 
        <input type="number" id="numero1">
    </label><br>

    <!-- Entrada del segundo número -->
    <label>Segundo número: 
        <input type="number" id="numero2">
    </label><br>

    <!-- Botón que ejecuta directamente la función calcular() -->
    <button onclick="calcular()">Calcular</button><br>

    <!-- Resultados -->
    <div>La suma es: <span id="suma"></span></div>
    <div>El producto es: <span id="producto"></span></div>
    <div>El número mayor es: <span id="mayor"></span></div>

    <script>

      // Función principal que realiza todos los cálculos
      function calcular() {

        // Obtiene los valores de los inputs y los convierte a número
        const numero1 = Number(document.getElementById("numero1").value);
        const numero2 = Number(document.getElementById("numero2").value);

        // Calcula suma y producto
        const suma = numero1 + numero2;
        const producto = numero1 * numero2;

        // Variable para almacenar el número mayor
        let mayor;

        // Estructura condicional para determinar el mayor
        if (numero1 > numero2) {
          mayor = numero1;
        } else if (numero2 > numero1) {
          mayor = numero2;
        } else {
          // Caso en que ambos números son iguales
          mayor = "Los números son iguales";
        }

        // Muestra los resultados en el HTML
        document.getElementById("suma").textContent = suma;
        document.getElementById("producto").textContent = producto;
        document.getElementById("mayor").textContent = mayor;
      }

    </script>
</body>
</html>
