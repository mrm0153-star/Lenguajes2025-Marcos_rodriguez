<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Define la codificación de caracteres (permite tildes, ñ, etc.) -->
    <meta charset="UTF-8">

    <!-- Hace que la página sea responsive en móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título de la página (lo que aparece en la pestaña del navegador) -->
    <title>Calculadora con Clases</title>
</head>
<body>

    <!-- Campo para introducir el primer número -->
    <label>Primer número: 
        <input type="number" id="numero1">
    </label><br>

    <!-- Campo para introducir el segundo número -->
    <label>Segundo número: 
        <input type="number" id="numero2">
    </label><br>

    <!-- Botón que ejecuta el cálculo -->
    <button id="calcularBtn">Calcular</button><br>

    <!-- Área donde se mostrará la suma -->
    <div>La suma es: <span id="suma"></span></div>

    <!-- Área donde se mostrará el producto -->
    <div>El producto es: <span id="producto"></span></div>

    <!-- Área donde se mostrará el número mayor -->
    <div>El número mayor es: <span id="mayor"></span></div>

    <script>
        // Definición de una clase para organizar la lógica de la calculadora
        class Calculadora {

            // Constructor: recibe los IDs de los elementos HTML
            constructor(numero1Id, numero2Id, sumaId, productoId, mayorId) {

                // Se guardan las referencias a los inputs
                this.numero1Input = document.getElementById(numero1Id);
                this.numero2Input = document.getElementById(numero2Id);

                // Se guardan las referencias a los elementos donde se mostrarán resultados
                this.sumaOutput = document.getElementById(sumaId);
                this.productoOutput = document.getElementById(productoId);
                this.mayorOutput = document.getElementById(mayorId);
            }
            
            // Método para convertir el valor del input a número
            obtenerNumero(input) {
                return Number(input.value);
            }
            
            // Método principal que realiza el cálculo
            calcular() {

                // Obtiene los valores de los inputs
                const numero1 = this.obtenerNumero(this.numero1Input);
                const numero2 = this.obtenerNumero(this.numero2Input);
                
                // Llama a otro método para mostrar resultados
                this.mostrarResultados(numero1, numero2);
            }
            
            // Método que muestra los resultados en pantalla
            mostrarResultados(numero1, numero2) {

                // Calcula y muestra la suma
                this.sumaOutput.textContent = numero1 + numero2;

                // Calcula y muestra el producto
                this.productoOutput.textContent = numero1 * numero2;

                // Determina el mayor o si son iguales
                this.mayorOutput.textContent = 
                    numero1 === numero2 
                    ? "Los números son iguales" 
                    : Math.max(numero1, numero2);
            }
        }
        
        // Se crea una instancia de la clase Calculadora
        const calculadora = new Calculadora(
            "numero1", 
            "numero2", 
            "suma", 
            "producto", 
            "mayor"
        );

        // Se añade un evento al botón para ejecutar el cálculo al hacer clic
        document
            .getElementById("calcularBtn")
            .addEventListener("click", () => calculadora.calcular());
    </script>
</body>
</html>
